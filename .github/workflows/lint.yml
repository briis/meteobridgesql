name: "Lint"

on:
  push:
    paths-ignore:
      - "**/README.md"
      - "**/info.md"
      - "**/CHANGELOG.md"
      - "**/CONTRIBUTING.md"
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  ruff:
    name: "Ruff"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v7.0.1"

        - name: "Set up Python"
          uses: actions/setup-python@v7.1.0
          with:
            python-version: "3.14"
            cache: "pip"

        - name: "Install Ruff"
          # Only Ruff is needed for linting; the version is taken from requirements.txt
          run: python3 -m pip install "$(grep -E '^ruff==' requirements.txt)"

        - name: "Run"
          run: python3 -m ruff check .
